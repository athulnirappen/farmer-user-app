services:
  postgres:
    image: postgres:16-alpine
    container_name: farmer-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmer_user
      POSTGRES_PASSWORD: farmer_password
      POSTGRES_DB: farmer_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmer_user -d farmer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: